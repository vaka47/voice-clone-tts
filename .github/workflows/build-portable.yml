name: Build portable apps

on:
  workflow_dispatch:
  push:
    branches:
      - codex/voice-clone-tts-portfolio
    paths:
      - "src/**"
      - "scripts/**"
      - "launcher.py"
      - "requirements*.txt"
      - "pyproject.toml"
      - ".github/workflows/build-portable.yml"

jobs:
  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Build macOS app
        run: bash scripts/build_macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: VoiceCloneTrainer-macOS
          path: release/VoiceCloneTrainer-macOS.zip

  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Build Windows app
        shell: pwsh
        run: scripts/build_windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: VoiceCloneTrainer-Windows
          path: release/VoiceCloneTrainer-Windows.zip
