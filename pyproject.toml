[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-clone-tts"
version = "0.1.0"
description = "Local XTTS voice cloning and text-to-speech pipeline"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "TTS==0.22.0",
  "librosa>=0.10",
  "soundfile>=0.12",
  "numpy<2.0; python_version >= '3.11'",
  "transformers<5",
  "gradio>=4.44,<5",
]

[project.scripts]
voice-clone-tts = "voice_clone_tts.cli:main"
voice-clone-tts-app = "voice_clone_tts.web_app:main"

[tool.setuptools.packages.find]
where = ["src"]
